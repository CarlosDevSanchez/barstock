<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Offline / Sin conexión</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                margin: 0;
                min-height: 100svh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
                background: #f8fafc;
                color: #0f172a;
                text-align: center;
                padding: 1.5rem;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #0f172a;
                    color: #f8fafc;
                }
                button {
                    background: #10b981 !important;
                }
            }
            main {
                max-width: 28rem;
            }
            h1 {
                font-size: 1.5rem;
                margin-bottom: 0.5rem;
            }
            p {
                opacity: 0.8;
                line-height: 1.5;
            }
            button {
                margin-top: 1.5rem;
                border: none;
                border-radius: 0.75rem;
                background: #059669;
                color: white;
                font-size: 1rem;
                padding: 0.75rem 1.5rem;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>You are offline / Estás sin conexión</h1>
            <p>
                This page is not available without a connection.<br />
                Esta página no está disponible sin conexión.
            </p>
            <button onclick="location.reload()">Retry / Reintentar</button>
        </main>
    </body>
</html>
