# The app, built as a production image. It does NOT start Supabase: it joins the network of the local Supabase stack that
# `supabase start` creates, so it reaches the API gateway by name. Use `bun run local:up`, which starts everything in order
# (Supabase -> seed users -> this file) and writes .env.docker.
#
#   docker compose --env-file .env.docker up -d --build
services:
    app:
        build:
            context: .
            args:
                NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?run `bun run local:up` (it writes .env.docker)}
                NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?run `bun run local:up`}
                APP_URL: ${APP_URL:-http://localhost:3000}
        image: barstock-app:local
        container_name: barstock_app
        ports:
            - '${APP_PORT:-3000}:3000'
        environment:
            NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
            SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?run `bun run local:up`}
            APP_URL: ${APP_URL:-http://localhost:3000}
        networks:
            - supabase
        restart: unless-stopped

networks:
    supabase:
        external: true
        # Created by the Supabase CLI; the name comes from `project_id` in supabase/config.toml.
        name: supabase_network_barstock
