# Portable base: builds and runs the app as a production image against ANY Supabase reachable at
# NEXT_PUBLIC_SUPABASE_URL (hosted or otherwise). Production deploys on Vercel and do not use this file (see D13,
# docs/06-roadmap/decisiones-pendientes.md); it exists so the container can be built and run the same way outside
# Vercel — e.g. to reproduce the production build locally, or on a self-hosted box, against a real Supabase.
#
# For LOCAL development against the Supabase CLI stack, layer docker-compose.local.yml on top (see
# docs/05-guias/docker-local.md); `bun run local:up` does this for you.
#
#   docker compose --env-file .env.docker up -d --build
services:
    app:
        build:
            context: .
            args:
                NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set it to your Supabase project's URL}
                NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set it to your Supabase project's anon key}
                APP_URL: ${APP_URL:-http://localhost:3000}
        image: barstock-app:local
        container_name: barstock_app
        ports:
            - '${APP_PORT:-3000}:3000'
        environment:
            NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
            SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set it to your Supabase project's service_role key (server only)}
            APP_URL: ${APP_URL:-http://localhost:3000}
        restart: unless-stopped
